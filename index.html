<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // VS Code needs a secure context: without crypto.subtle the extension
      // host iframe cannot start, so the memfs provider is never registered
      // and the workspace fails to load. isSecureContext is the browser's own
      // answer to that question — it already treats localhost as secure.
      if (!isSecureContext && location.protocol === "http:") {
        location.replace(location.href.replace(/^http:/, "https:"));
      }
    </script>
    <!-- Phones render the workbench at 65% so the UI chrome does not eat the
         screen. Desktop browsers ignore this tag entirely. `window.zoomLevel`
         cannot do this: the web build only reads it for the splash screen. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=0.65, maximum-scale=0.65, minimum-scale=0.65, user-scalable=no"
    />
    <title>ふぁ | Portfolio</title>
    <meta name="description" content="VS Code for the Web 上で動くポートフォリオ" />
    <link rel="icon" href="./vscode-dist/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="./vscode-dist/code-192.png" />
    <link rel="manifest" href="./vscode-dist/manifest.json" />
    <link rel="stylesheet" href="./vscode-dist/out/vs/workbench/workbench.web.main.internal.css" />
    <style>
      /* Matches the workbench background of the theme picked for this OS
         colour scheme, so the page never flashes before the workbench paints. */
      html {
        background: #f3f3f3;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #1f1f1f;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "vscode-web/workbench": "./vscode-dist/out/vs/workbench/workbench.web.main.internal.js"
        }
      }
    </script>
  </head>

  <body aria-label=""></body>

  <script>
    globalThis._VSCODE_FILE_ROOT = new URL("./vscode-dist/out/", document.baseURI).href;
  </script>
  <script src="./vscode-dist/out/nls.messages.js"></script>
  <script type="module" src="./assets/main.js"></script>
</html>
